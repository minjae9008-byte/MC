# RPGCore configuration.
#
# 이 파일 하나가 전부입니다. 데이터팩도, 추가 플러그인도 필요 없습니다.
# 대부분의 값은 /rpgcore reload 로 재시작 없이 반영됩니다.
#
# 아이템/블록 목록(weight.tiers.*.items, tree-felling.logs/tools, anvil target)은
# 아이템 ID 와 태그를 섞어 쓸 수 있습니다:
#   minecraft:stone            낱개 ID
#   '#minecraft:planks'        바닐라 태그 (그 태그에 속한 전부)
#   '#myserver:custom'         서버에 깔린 다른 데이터팩의 태그
# 이 서버 버전에 없는 항목은 경고만 남기고 건너뛰므로, 한 설정으로 여러 버전을
# 커버할 수 있습니다.

leveling:
  xp-base: 100          # XP needed for level 2
  xp-growth: 50         # extra XP needed per level after that
  starting-points: 5
  points-per-level: 1

stats:
  base-hp: 20           # attribute points; 20 = the vanilla 10 hearts
  hp-per-level: 2
  hp-per-vit: 1
  attack-damage-per-str: 0.5
  attack-speed-per-dex: 0.05
  movement-speed-per-agi: 0.002
  jump-strength-per-agi: 0.01   # Java only: Bedrock has no jump attribute
  luck-per-luck: 0.5

weight:
  base-capacity: 100
  capacity-per-str: 10
  # Weight is only recomputed for players whose inventory changed (events set
  # a dirty flag). These two just bound the worst case.
  scans-per-tick: 8
  safety-rescan-ticks: 200
  default-item-weight: 1
  # 아이템 1개당 무게이며 개수만큼 곱해집니다.
  tiers:
    light:
      weight: 1
      items:
        - minecraft:stick
        - minecraft:string
        - minecraft:feather
        - minecraft:paper
        - minecraft:gunpowder
        - minecraft:redstone
        - minecraft:glowstone_dust
        - minecraft:ender_pearl
        - minecraft:arrow
        - minecraft:flint
        - minecraft:wheat_seeds
        - minecraft:beetroot_seeds
        - minecraft:melon_seeds
        - minecraft:pumpkin_seeds
        - minecraft:wheat
        - minecraft:sugar
        - minecraft:bone_meal
        - minecraft:leather
        - minecraft:white_dye
        - minecraft:orange_dye
        - minecraft:magenta_dye
        - minecraft:light_blue_dye
        - minecraft:yellow_dye
        - minecraft:lime_dye
        - minecraft:pink_dye
        - minecraft:gray_dye
        - minecraft:light_gray_dye
        - minecraft:cyan_dye
        - minecraft:purple_dye
        - minecraft:blue_dye
        - minecraft:brown_dye
        - minecraft:green_dye
        - minecraft:red_dye
        - minecraft:black_dye
        - '#minecraft:small_flowers'
        - '#minecraft:saplings'
    medium:
      weight: 3
      items:
        - '#minecraft:planks'
        - '#minecraft:logs'
        - '#minecraft:wool'
        - '#minecraft:swords'
        - '#minecraft:axes'
        - '#minecraft:hoes'
        - '#minecraft:shovels'
        - minecraft:bow
        - minecraft:crossbow
        - minecraft:trident
        - minecraft:shield
        - minecraft:bread
        - minecraft:cooked_beef
        - minecraft:cooked_porkchop
        - minecraft:cooked_chicken
        - minecraft:apple
        - minecraft:golden_apple
        - minecraft:bucket
        - minecraft:water_bucket
        - minecraft:lava_bucket
        - minecraft:milk_bucket
        - minecraft:iron_ingot
        - minecraft:gold_ingot
        - minecraft:copper_ingot
    heavy:
      weight: 8
      items:
        - '#minecraft:pickaxes'
        - '#minecraft:stone_tool_materials'
        - minecraft:cobblestone
        - minecraft:stone
        - minecraft:deepslate
        - minecraft:netherrack
        - minecraft:obsidian
        - minecraft:iron_block
        - minecraft:gold_block
        - minecraft:copper_block
        - minecraft:raw_iron
        - minecraft:raw_gold
        - minecraft:raw_copper
        - minecraft:iron_ore
        - minecraft:gold_ore
        - minecraft:deepslate_iron_ore
        - minecraft:deepslate_gold_ore
        - minecraft:chest
        - minecraft:barrel
        - minecraft:furnace
