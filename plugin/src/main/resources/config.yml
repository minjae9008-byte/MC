# ==========================================================================
#  RPGCore - 세부 설정
# ==========================================================================
#  자주 바꾸는 값(최대 레벨, 경험치 곡선, 인챈트 한계, 기능 on/off)은
#  settings.yml 에, 직업 정의는 jobs.yml, 업적과 칭호는 achievements.yml,
#  수집 도감은 collection.yml 에 있습니다. 이 파일은 아이템 분류나
#  모루 조합법처럼 목록이 긴 설정을 담습니다.
#
#  아이템/블록 목록은 ID 와 태그를 섞어 쓸 수 있습니다:
#    minecraft:stone            낱개 ID
#    '#minecraft:planks'        바닐라 태그 (그 태그에 속한 전부)
#    '#myserver:custom'         서버에 깔린 다른 데이터팩의 태그
#  이 서버 버전에 없는 항목은 경고만 남기고 건너뜁니다.
#
#  지금 설정이 어떻게 읽혔는지는 /rpgcore check 로 확인하세요.
# ==========================================================================

stats:
  base-hp: 20           # attribute points; 20 = the vanilla 10 hearts
  hp-per-level: 2
  hp-per-vit: 1
  attack-damage-per-str: 0.5
  attack-speed-per-dex: 0.05
  movement-speed-per-agi: 0.002
  jump-strength-per-agi: 0.01   # Java only: Bedrock has no jump attribute
  luck-per-luck: 0.5

weight:
  base-capacity: 100
  capacity-per-str: 10
  # Weight is only recomputed for players whose inventory changed (events set
  # a dirty flag). These two just bound the worst case.
  scans-per-tick: 8
  safety-rescan-ticks: 200
  default-item-weight: 1
  # 아이템 설명(툴팁)에 붙는 무게 한 줄. %weight% 는 "1개당" 무게입니다.
  # 개수와 무관한 값이라야 같은 아이템끼리 계속 겹쳐지므로 총합은 넣지 않습니다.
  # 끄려면 settings.yml 의 features.item-weight-lore 를 false 로.
  lore-format: "&8무게 %weight%"
  # 아이템 1개당 무게이며 개수만큼 곱해집니다.
  tiers:
    light:
      weight: 1
      items:
        - minecraft:stick
        - minecraft:string
        - minecraft:feather
        - minecraft:paper
        - minecraft:gunpowder
        - minecraft:redstone
        - minecraft:glowstone_dust
        - minecraft:ender_pearl
        - minecraft:arrow
        - minecraft:flint
        - minecraft:wheat_seeds
        - minecraft:beetroot_seeds
        - minecraft:melon_seeds
        - minecraft:pumpkin_seeds
        - minecraft:wheat
        - minecraft:sugar
        - minecraft:bone_meal
        - minecraft:leather
        - minecraft:white_dye
        - minecraft:orange_dye
        - minecraft:magenta_dye
        - minecraft:light_blue_dye
        - minecraft:yellow_dye
        - minecraft:lime_dye
        - minecraft:pink_dye
        - minecraft:gray_dye
        - minecraft:light_gray_dye
        - minecraft:cyan_dye
        - minecraft:purple_dye
        - minecraft:blue_dye
        - minecraft:brown_dye
        - minecraft:green_dye
        - minecraft:red_dye
        - minecraft:black_dye
        - '#minecraft:small_flowers'
        - '#minecraft:saplings'
    medium:
      weight: 3
      items:
        - '#minecraft:planks'
        - '#minecraft:logs'
        - '#minecraft:wool'
        - '#minecraft:swords'
        - '#minecraft:axes'
        - '#minecraft:hoes'
        - '#minecraft:shovels'
        - minecraft:bow
        - minecraft:crossbow
        - minecraft:trident
        - minecraft:shield
        - minecraft:bread
        - minecraft:cooked_beef
        - minecraft:cooked_porkchop
        - minecraft:cooked_chicken
        - minecraft:apple
        - minecraft:golden_apple
        - minecraft:bucket
        - minecraft:water_bucket
        - minecraft:lava_bucket
        - minecraft:milk_bucket
        - minecraft:iron_ingot
        - minecraft:gold_ingot
        - minecraft:copper_ingot
    heavy:
      weight: 8
      items:
        - '#minecraft:pickaxes'
        - '#minecraft:stone_tool_materials'
        - minecraft:cobblestone
        - minecraft:stone
        - minecraft:deepslate
        - minecraft:netherrack
        - minecraft:obsidian
        - minecraft:iron_block
        - minecraft:gold_block
        - minecraft:copper_block
        - minecraft:raw_iron
        - minecraft:raw_gold
        - minecraft:raw_copper
        - minecraft:iron_ore
        - minecraft:gold_ore
        - minecraft:deepslate_iron_ore
        - minecraft:deepslate_gold_ore
        - minecraft:chest
        - minecraft:barrel
        - minecraft:furnace
        - minecraft:anvil
        - minecraft:chipped_anvil
        - minecraft:damaged_anvil
        - minecraft:iron_chestplate
        - minecraft:iron_leggings
        - minecraft:diamond_chestplate
        - minecraft:diamond_leggings
    very_heavy:
      weight: 20
      items:
        - '#minecraft:shulker_boxes'
        - minecraft:netherite_ingot
        - minecraft:netherite_block
        - minecraft:netherite_helmet
        - minecraft:netherite_chestplate
        - minecraft:netherite_leggings
        - minecraft:netherite_boots
        - minecraft:beacon
        - minecraft:diamond_block
        - minecraft:emerald_block
        - minecraft:lodestone
        - minecraft:respawn_anchor
        - minecraft:enchanting_table

tree-felling:
  # Hard cap per tree, so a griefed "log wall" can never run away.
  max-blocks: 256
  # Blocks removed per tick; the rest is queued, so big trees never spike.
  blocks-per-tick: 12
  # Fire a BlockBreakEvent for every chained block so WorldGuard/GriefPrevention
  # and friends can veto it. Costs one event per block; leave on unless you
  # have no protection plugins.
  respect-protection-plugins: true
  damage-tool: true
  sneak-disables: true
  # 가지를 따라 퍼질 수 있는 가로 반경(블록). 원점에서 이만큼까지만 번지므로
  # 옆 나무로 옮겨붙지 않습니다. 아카시아처럼 가지가 긴 나무는 5~7 이 적당합니다.
  max-horizontal-radius: 5
  # 연쇄로 잘릴 블록. '#minecraft:logs' 로 한 줄에 끝낼 수도 있지만, 그러면
  # 6면 원목(oak_wood 등)까지 포함되어 원목으로 지은 건축물도 연쇄로 부서집니다.
  logs:
    - minecraft:oak_log
    - minecraft:spruce_log
    - minecraft:birch_log
    - minecraft:jungle_log
    - minecraft:acacia_log
    - minecraft:dark_oak_log
    - minecraft:mangrove_log
    - minecraft:cherry_log
    - minecraft:pale_oak_log
    - minecraft:crimson_stem
    - minecraft:warped_stem
    - minecraft:stripped_oak_log
    - minecraft:stripped_spruce_log
    - minecraft:stripped_birch_log
    - minecraft:stripped_jungle_log
    - minecraft:stripped_acacia_log
    - minecraft:stripped_dark_oak_log
    - minecraft:stripped_mangrove_log
    - minecraft:stripped_cherry_log
    - minecraft:stripped_pale_oak_log
    - minecraft:stripped_crimson_stem
    - minecraft:stripped_warped_stem
  tools: ['#minecraft:axes']

# 내구도에 따른 성능 저하.
# 남은 내구도가 full-performance-above% 이상이면 페널티 없음, 그 아래부터
# 0%까지 minimum-performance%로 직선 감소합니다. 아이템 자체는 건드리지 않고
# 플레이어 어트리뷰트에 MULTIPLY_SCALAR_1 모디파이어로 적용합니다.
# (수리하면 그대로 성능이 돌아오므로, 아래 anvil 조합법의 repair-percent가
#  곧 성능 회복입니다.)
durability-scaling:
  full-performance-above: 80
  minimum-performance: 50
  affects:
    attack-damage: true      # 주 손 아이템 기준
    armor: true              # 착용 중인 방어구의 평균 내구도 기준
    mining-speed: true       # block_break_speed
    ranged-damage: true      # 활/석궁/삼지창: 발사 시점 무기 상태로 투사체 피해 조정

# 모루 커스텀 조합법. 왼쪽 칸=강화할 장비, 오른쪽 칸=재료.
# target 은 아이템 ID 또는 태그(#minecraft:..., #rpgcore:...) 목록입니다.
# 조합법이 일치하지 않는 조합은 전부 바닐라 모루 동작 그대로입니다.
#
# level-cost 는 기본 0(무료)이고, enchantments 의 max-level 을 적지 않으면
# 상한이 없습니다 - 재료만 있으면 몇 번이든 반복해서 올릴 수 있습니다.
# 바닐라의 "수리 비용이 너무 비쌉니다" 누적 제한도 커스텀 조합에는 걸리지
# 않습니다(작업 횟수 비용을 올리지 않고 그대로 넘깁니다).
# 상한을 되살리려면:
#   enchantments:
#     sharpness:
#       levels: 1
#       max-level: 5
#
# 재료 선택 주의: 그 장비의 바닐라 수리 재료(철 갑옷 + 철 주괴 등)를 쓰면
# 바닐라 수리를 덮어씁니다. 아래 기본값이 철 '블록'과 숫돌을 쓰는 이유입니다.
anvil:
  recipes:
    sharpen:
      name: "&b날 세우기"                    # 부싯돌로 날을 갈아 세운다
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:flint
      ingredient-amount: 2
      enchantments:
        sharpness: 1
    smite:
      name: "&b성화 각인"                    # 빛 = 언데드 특효
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:glowstone_dust
      ingredient-amount: 3
      enchantments:
        smite: 1
    bane:
      name: "&b독 바르기"                    # 거미 눈의 독을 날에 바른다
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:spider_eye
      ingredient-amount: 3
      enchantments:
        bane_of_arthropods: 1
    efficiency:
      name: "&b기계 정비"                    # 레드스톤으로 동력 전달을 다듬는다
      target: ['#minecraft:enchantable/mining']
      ingredient: minecraft:redstone
      ingredient-amount: 4
      enchantments:
        efficiency: 1
    protection:
      name: "&b철판 덧대기"                  # 철 블록을 두들겨 갑옷을 보강
      target: ['#minecraft:enchantable/armor']
      ingredient: minecraft:iron_block
      ingredient-amount: 1
      enchantments:
        protection: 1
    reinforce:
      name: "&b흑요석 담금질"                # 가장 단단한 재료로 단단하게
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:obsidian
      ingredient-amount: 2
      enchantments:
        unbreaking: 1
    repair-kit:
      name: "&a숫돌 정비"                    # 숫돌로 갈아 손질한다
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:grindstone
      ingredient-amount: 1
      repair-percent: 25

# 순위표. 데이터는 스코어보드 미러에서 읽으므로 오프라인 플레이어도 집계됩니다.
leaderboard:
  size: 10            # /leaderboard 에 보여줄 인원
  cache-seconds: 30   # 이 시간 동안은 정렬 결과를 재사용

# 파티. plugins/RPGCorePlugin/parties.yml 에 저장되어 재시작해도 유지됩니다.
party:
  max-size: 5
  name-max-length: 16
  invite-timeout-seconds: 60
  friendly-fire: false        # false 면 파티원끼리 피해를 주지 않음
  chat-prefix: "&d[%party%] "   # %party% 는 파티 이름으로 바뀝니다
  xp:
    # 파티가 획득한 XP 는 사거리 안에 있고 "접속 중인" 파티원끼리만 똑같이
    # 나눕니다. 오프라인 파티원은 몫도 받지 않고 인원 보너스에도 안 들어갑니다.
    # 총량 = 원래 XP x (1 + bonus-per-member x (접속 인원-1))
    share-range: 50           # 블록. 0 이면 같은 월드 전체
    bonus-per-member: 0.05

# 플레이어 간 거래. 상자 UI 하나를 양쪽이 같이 보며 물건을 올립니다.
trade:
  request-timeout-seconds: 60
  max-distance: 0             # 블록. 0 이면 같은 월드면 거리 제한 없음
  title: "&8거래"

hud:
  # Action-bar text persists ~3s, so once a second is smooth and cheap.
  interval-ticks: 20

# 머리 위 이름표와 플레이어 목록(Tab)에 붙는 정보.
# 스코어보드 팀 기능으로 붙이므로 자바/베드락(Geyser) 모두 똑같이 보입니다.
#
#   이름표  ->  [파티] [칭호] 이름 Lv.12 전사
#   목록    ->  [파티] [칭호] 이름 Lv.12
#
# 파티가 없거나 직업이 없으면 그 조각은 통째로 빠집니다(빈 괄호가 남지 않음).
# 다른 플러그인이 이름표/팀을 관리한다면 settings.yml 의 features.nameplate 를
# false 로 두세요.
display:
  # 조각별 서식. %party% %title% %level% %job% 이 바뀝니다.
  # ""(빈 값)이면 그 조각은 어디에도 표시되지 않습니다.
  # 칭호 문구 자체는 achievements.yml / collection.yml 에서 정합니다.
  party-format: "&8[&d%party%&8]"
  title-format: "%title%"
  level-format: "&7Lv.&e%level%"
  job-format: "&b%job%"

  nameplate:
    show-party: true
    show-title: true
    show-level: true
    show-job: true
  tablist:
    show-party: true
    show-title: true
    show-level: true
    show-job: false

proximity-chat:
  range: 24
  # %player% and %message% are replaced; '&' colour codes are supported.
  format: "&7[근접] &f%player%&7: &f%message%"
  # true  = players outside the range do not receive the message at all
  #         (real proximity chat).
  # false = everyone still receives it; only the [근접] formatting is applied.
  hide-out-of-range: true
  # Simple Voice Chat 이 깔려 있으면 그쪽 voice_chat_distance 와 위 range 가
  # 어긋날 때 기동 로그에 경고를 남깁니다. (음성 자체는 그 플러그인이 담당)
  warn-voice-range-mismatch: true

# 골드. 업적 보상으로 들어오고 대결에 걸 수 있습니다.
# 스코어보드(rpgcore.gold)에 저장되므로 /scoreboard 로도 읽고 쓸 수 있고,
# 별도 경제 플러그인이 필요 없습니다.
economy:
  starting-gold: 0
  gold-per-mob-kill: 2
  gold-per-level-up: 50
  symbol: "G"              # 금액 뒤에 붙는 단위 표시

# 1:1 대결. 양쪽이 같은 것을 걸고, 쓰러뜨린 쪽이 전부 가져갑니다.
# 죽지 않고 '쓰러짐'으로 끝나므로 진 쪽도 아이템을 떨어뜨리지 않습니다.
# 월드의 PvP 가 꺼져 있으면 신청 단계에서 막힙니다.
duel:
  request-timeout-seconds: 60
  max-distance: 32          # 신청·수락 시 최대 거리. 0 이면 같은 월드면 됨
  max-gold-wager: 1000      # 한 번에 걸 수 있는 골드 상한. 0 이면 제한 없음
  max-duration-seconds: 300 # 이 시간이 지나면 무승부로 끝내고 건 것을 돌려줍니다
  announce-result: true

# 도감과 칭호 화면 제목.
collection:
  title: "&8도감"
titles:
  menu-title: "&8칭호"

gui:
  title: "&8캐릭터 정보"
  # 27~54 사이 9의 배수. 벗어나면 자동으로 맞춰집니다.
  size: 27

