tree-felling:
  # Hard cap per tree, so a griefed "log wall" can never run away.
  max-blocks: 256
  # Blocks removed per tick, shared by every fell running on the server - not
  # per tree. With respect-protection-plugins on this is also the ceiling on
  # how many synthetic BlockBreakEvents other plugins have to answer per tick,
  # which is the number that actually costs tick time.
  blocks-per-tick: 12
  # Fire a BlockBreakEvent for every chained block so WorldGuard/GriefPrevention
  # and friends can veto it. Costs one event per block; leave on unless you
  # have no protection plugins.
  respect-protection-plugins: true
  damage-tool: true
  sneak-disables: true
  # 가지를 따라 퍼질 수 있는 가로 반경(블록). 원점에서 이만큼까지만 번지므로
  # 옆 나무로 옮겨붙지 않습니다. 아카시아처럼 가지가 긴 나무는 5~7 이 적당합니다.
  max-horizontal-radius: 5
  # 연쇄로 잘릴 블록. '#minecraft:logs' 로 한 줄에 끝낼 수도 있지만, 그러면
  # 6면 원목(oak_wood 등)까지 포함되어 원목으로 지은 건축물도 연쇄로 부서집니다.
  logs:
    - minecraft:oak_log
    - minecraft:spruce_log
    - minecraft:birch_log
    - minecraft:jungle_log
    - minecraft:acacia_log
    - minecraft:dark_oak_log
    - minecraft:mangrove_log
    - minecraft:cherry_log
    - minecraft:pale_oak_log
    - minecraft:crimson_stem
    - minecraft:warped_stem
    - minecraft:stripped_oak_log
    - minecraft:stripped_spruce_log
    - minecraft:stripped_birch_log
    - minecraft:stripped_jungle_log
    - minecraft:stripped_acacia_log
    - minecraft:stripped_dark_oak_log
    - minecraft:stripped_mangrove_log
    - minecraft:stripped_cherry_log
    - minecraft:stripped_pale_oak_log
    - minecraft:stripped_crimson_stem
    - minecraft:stripped_warped_stem
  tools: ['#minecraft:axes']

# 내구도에 따른 성능 저하.
# 남은 내구도가 full-performance-above% 이상이면 페널티 없음, 그 아래부터
# 0%까지 minimum-performance%로 직선 감소합니다. 아이템 자체는 건드리지 않고
# 플레이어 어트리뷰트에 MULTIPLY_SCALAR_1 모디파이어로 적용합니다.
# (수리하면 그대로 성능이 돌아오므로, 아래 anvil 조합법의 repair-percent가
#  곧 성능 회복입니다.)
durability-scaling:
  full-performance-above: 80
  minimum-performance: 50
  affects:
    attack-damage: true      # 주 손 아이템 기준
    armor: true              # 착용 중인 방어구의 평균 내구도 기준
    mining-speed: true       # block_break_speed
    ranged-damage: true      # 활/석궁/삼지창: 발사 시점 무기 상태로 투사체 피해 조정

# 모루 커스텀 조합법. 왼쪽 칸=강화할 장비, 오른쪽 칸=재료.
# target 은 아이템 ID 또는 태그(#minecraft:..., #rpgcore:...) 목록입니다.
# 조합법이 일치하지 않는 조합은 전부 바닐라 모루 동작 그대로입니다.
#
# level-cost 는 적지 않으면 1 입니다. 0(무료)으로 두면 바닐라 모루가 결과물을
# 꺼내지 못하게 막을 수 있습니다 - 결과 칸에 아이템은 보이는데 집히지 않으면
# 그게 원인이며, 기동 로그에도 경고가 남습니다. 그럴 땐 1 이상으로 올리세요.
# enchantments 의 max-level 을 적지 않으면 상한이 없습니다 - 재료만 있으면
# 몇 번이든 반복해서 올릴 수 있습니다.
# 바닐라의 "수리 비용이 너무 비쌉니다" 누적 제한도 커스텀 조합에는 걸리지
# 않습니다(작업 횟수 비용을 올리지 않고 그대로 넘깁니다).
# 상한을 되살리려면:
#   enchantments:
#     sharpness:
#       levels: 1
#       max-level: 5
#
# 재료 선택 주의: 그 장비의 바닐라 수리 재료(철 갑옷 + 철 주괴 등)를 쓰면
# 바닐라 수리를 덮어씁니다. 아래 기본값이 철 '블록'과 숫돌을 쓰는 이유입니다.
anvil:
  recipes:
    sharpen:
      name: "&b날 세우기"                    # 부싯돌로 날을 갈아 세운다
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:flint
      ingredient-amount: 2
      level-cost: 1
      enchantments:
        sharpness: 1
    smite:
      name: "&b성화 각인"                    # 빛 = 언데드 특효
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:glowstone_dust
      ingredient-amount: 3
      level-cost: 1
      enchantments:
        smite: 1
    bane:
      name: "&b독 바르기"                    # 거미 눈의 독을 날에 바른다
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:spider_eye
      ingredient-amount: 3
      level-cost: 1
      enchantments:
        bane_of_arthropods: 1
    efficiency:
      name: "&b기계 정비"                    # 레드스톤으로 동력 전달을 다듬는다
      target: ['#minecraft:enchantable/mining']
      ingredient: minecraft:redstone
      ingredient-amount: 4
      level-cost: 1
      enchantments:
        efficiency: 1
    protection:
      name: "&b철판 덧대기"                  # 철 블록을 두들겨 갑옷을 보강
      target: ['#minecraft:enchantable/armor']
      ingredient: minecraft:iron_block
      ingredient-amount: 1
      level-cost: 2
      enchantments:
        protection: 1
    reinforce:
      name: "&b흑요석 담금질"                # 가장 단단한 재료로 단단하게
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:obsidian
      ingredient-amount: 2
      level-cost: 2
      enchantments:
        unbreaking: 1
    repair-kit:
      name: "&a숫돌 정비"                    # 숫돌로 갈아 손질한다
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:grindstone
      ingredient-amount: 1
      level-cost: 1
      repair-percent: 25

    # --- 여기부터는 후반부용. 재료가 비싸고 효과가 큽니다 -----------------

    master-repair:
      name: "&a완전 정비"                    # 네더라이트로 통째로 벼려낸다
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:netherite_scrap
      ingredient-amount: 1
      level-cost: 5
      repair-percent: 100

    looting:
      name: "&b약탈 각인"                    # 상자에서 나온 실로 매듭을 짓는다
      target: ['#minecraft:swords']
      ingredient: minecraft:string
      ingredient-amount: 16
      level-cost: 3
      enchantments:
        looting:
          levels: 1
          max-level: 5

    fortune:
      name: "&e행운 각인"                    # 청금석을 갈아 날에 먹인다
      target: ['#minecraft:enchantable/mining']
      ingredient: minecraft:lapis_lazuli
      ingredient-amount: 24
      level-cost: 4
      enchantments:
        fortune:
          levels: 1
          max-level: 3

    silk:
      name: "&f섬세한 손길"                  # 거미줄처럼 조심스럽게
      target: ['#minecraft:enchantable/mining']
      ingredient: minecraft:cobweb
      ingredient-amount: 4
      level-cost: 4
      enchantments:
        silk_touch:
          levels: 1
          max-level: 1

    power:
      name: "&b활시위 보강"                  # 힘줄을 꼬아 시위를 덧댄다
      target: ['#minecraft:enchantable/bow']
      ingredient: minecraft:phantom_membrane
      ingredient-amount: 3
      level-cost: 2
      enchantments:
        power: 1

    feather-fall:
      name: "&a깃털 안감"                    # 신발 안에 깃털을 넣는다
      target: ['#minecraft:enchantable/foot_armor']
      ingredient: minecraft:feather
      ingredient-amount: 16
      level-cost: 2
      enchantments:
        feather_falling:
          levels: 1
          max-level: 4

    respiration:
      name: "&3해초 여과"                    # 마른 해초로 숨길을 만든다
      target: ['#minecraft:enchantable/head_armor']
      ingredient: minecraft:dried_kelp_block
      ingredient-amount: 4
      level-cost: 2
      enchantments:
        respiration:
          levels: 1
          max-level: 3

    thorns:
      name: "&c가시 덧대기"                  # 선인장을 갑옷에 박는다
      target: ['#minecraft:enchantable/chest_armor']
      ingredient: minecraft:cactus
      ingredient-amount: 12
      level-cost: 3
      enchantments:
        thorns:
          levels: 1
          max-level: 3

    mending:
      name: "&d경험의 수선"                  # 경험이 쇠를 메운다
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:nether_star
      ingredient-amount: 1
      level-cost: 10
      enchantments:
        mending:
          levels: 1
          max-level: 1

# 순위표. 데이터는 스코어보드 미러에서 읽으므로 오프라인 플레이어도 집계됩니다.
leaderboard:
  size: 10            # /leaderboard 에 보여줄 인원
  cache-seconds: 30   # 이 시간 동안은 정렬 결과를 재사용

# 파티. plugins/RPGCorePlugin/parties.yml 에 저장되어 재시작해도 유지됩니다.
party:
  max-size: 5
  name-max-length: 16
  invite-timeout-seconds: 60
  friendly-fire: false        # false 면 파티원끼리 피해를 주지 않음
  chat-prefix: "&d[%party%] "   # %party% 는 파티 이름으로 바뀝니다
  xp:
    # 파티가 획득한 XP 는 사거리 안에 있고 "접속 중인" 파티원끼리만 똑같이
    # 나눕니다. 오프라인 파티원은 몫도 받지 않고 인원 보너스에도 안 들어갑니다.
    # 총량 = 원래 XP x (1 + bonus-per-member x (접속 인원-1))
    share-range: 50           # 블록. 0 이면 같은 월드 전체
    bonus-per-member: 0.05

# 플레이어 간 거래. 상자 UI 하나를 양쪽이 같이 보며 물건을 올립니다.
trade:
  request-timeout-seconds: 60
  max-distance: 0             # 블록. 0 이면 같은 월드면 거리 제한 없음
  title: "&8거래"

# 길드 보관함·경매·파티·우편함이 디스크에 기록되는 주기(틱).
# 바뀐 내용은 메모리에 모아 두었다가 이 주기마다 한 번에, 메인 스레드 밖에서 씁니다.
# 낮출수록 갑작스러운 크래시에 덜 잃고 기록 횟수가 늘어납니다. 20 = 1초.
persistence:
  flush-interval-ticks: 20

hud:
  # Action-bar text persists ~3s, so once a second is smooth and cheap.
  # 이름표 갱신과 과적재 페널티 재적용도 이 주기를 탑니다. 과적재 효과 지속
  # 시간은 이 값에 맞춰 늘어나므로 크게 올려도 페널티에 구멍이 생기지 않고,
  # 이름표만 그만큼 늦게 갱신됩니다. /rpgcore reload 로 바로 반영됩니다.
  interval-ticks: 20

# 머리 위 이름표와 플레이어 목록(Tab)에 붙는 정보.
# 스코어보드 팀 기능으로 붙이므로 자바/베드락(Geyser) 모두 똑같이 보입니다.
#
#   이름표  ->  [파티] [칭호] 이름 Lv.12 전사
#   목록    ->  [파티] [칭호] 이름 Lv.12
#
# 파티가 없거나 직업이 없으면 그 조각은 통째로 빠집니다(빈 괄호가 남지 않음).
# 다른 플러그인이 이름표/팀을 관리한다면 settings.yml 의 features.nameplate 를
# false 로 두세요.
display:
  # 조각별 서식. %party% %title% %level% %job% 이 바뀝니다.
  # ""(빈 값)이면 그 조각은 어디에도 표시되지 않습니다.
  # 칭호 문구 자체는 achievements.yml / collection.yml 에서 정합니다.
  party-format: "&8[&d%party%&8]"
  title-format: "%title%"
  level-format: "&7Lv.&e%level%"
  job-format: "&b%job%"

  nameplate:
    show-party: true
    show-title: true
    show-level: true
    show-job: true
  tablist:
    show-party: true
    show-title: true
    show-level: true
    show-job: false

proximity-chat:
  range: 24
  # %player% and %message% are replaced; '&' colour codes are supported.
  format: "&7[근접] &f%player%&7: &f%message%"
  # true  = players outside the range do not receive the message at all
  #         (real proximity chat).
  # false = everyone still receives it; only the [근접] formatting is applied.
  hide-out-of-range: true
  # Simple Voice Chat 이 깔려 있으면 그쪽 voice_chat_distance 와 위 range 가
  # 어긋날 때 기동 로그에 경고를 남깁니다. (음성 자체는 그 플러그인이 담당)
  warn-voice-range-mismatch: true

# 업적 집계에 쓰는 블록 목록. 비워 두면 바닐라 기본값을 씁니다.
# 모드나 데이터팩의 광석/원목을 세고 싶을 때만 채우세요.
# (문법은 위 아이템 목록과 같습니다: 낱개 ID 또는 #태그)
progress:
  ore-blocks: []
  log-blocks: []

# 골드. 업적·도감 보상과 몬스터 처치·레벨업으로 들어오고,
# 경매장·길드·대결에서 쓰입니다.
# 스코어보드(rpgcore.gold)에 저장되므로 /scoreboard 로도 읽고 쓸 수 있고,
# 별도 경제 플러그인이 필요 없습니다.
#
# 수치는 "몬스터 1마리 = 6골드" 를 기준으로 잡혀 있습니다. 적극적으로 놀면
# 시간당 대략 900골드, 여기에 레벨업 보상과 업적·도감 보상이 더해집니다.
# 길드 창설 2,000 = 혼자서도 반나절, 길드원이 모으면 금방입니다.
economy:
  starting-gold: 0
  gold-per-mob-kill: 6
  gold-per-level-up: 120
  # LUCK 1포인트당 처치 보상이 2배가 될 확률(%). 상한을 두는 이유는,
  # "항상 2배"에 닿는 순간 그건 운이 아니라 모두가 찍어야 하는 고정 배수가
  # 되기 때문입니다.
  luck-double-chance-per-point: 2.0
  luck-double-chance-max: 60
  symbol: "G"              # 금액 뒤에 붙는 단위 표시
  allow-player-transfer: true   # /pay 로 플레이어끼리 주고받기

# 1:1 대결. 양쪽이 같은 것을 걸고, 쓰러뜨린 쪽이 전부 가져갑니다.
# 죽지 않고 '쓰러짐'으로 끝나므로 진 쪽도 아이템을 떨어뜨리지 않습니다.
# 월드의 PvP 가 꺼져 있으면 신청 단계에서 막힙니다.
duel:
  request-timeout-seconds: 60
  max-distance: 32          # 신청·수락 시 최대 거리. 0 이면 같은 월드면 됨
  max-gold-wager: 1000      # 한 번에 걸 수 있는 골드 상한. 0 이면 제한 없음
  max-duration-seconds: 300 # 이 시간이 지나면 무승부로 끝내고 건 것을 돌려줍니다
  countdown-seconds: 3      # 시작 전 카운트다운. 그동안은 서로 때릴 수 없습니다. 0 이면 즉시 시작
  heal-before-start: true   # 시작할 때 양쪽 체력을 채워 공정하게 맞춥니다
  # 대결이 끝난 뒤 다음 대결까지 기다려야 하는 시간(초). 0 이면 제한 없음.
  # heal-before-start 가 켜져 있으면 '수락 -> 기권'만 반복해도 양쪽이 계속
  # 회복되므로, 이 값이 대결을 회복 수단으로 쓰지 못하게 막습니다.
  cooldown-seconds: 30
  announce-result: true

# 도감과 칭호 화면 제목.
collection:
  title: "&8도감"
titles:
  menu-title: "&8칭호"

# 길드. 파티가 하룻저녁 모임이라면 길드는 공동 보관함과 땅을 가진 조직입니다.
#
#   /guild create <이름>    창설 (create-cost 골드)
#   /guild vault            공동 보관함 - 길드원 전원이 같은 상자를 함께 봅니다
#   /guild banner           영지 깃발 구입 -> 세우면 그 자리가 영지 (길드당 1개)
#   /guild deposit|withdraw 길드 금고
#   /guild invest <금액>    금고의 골드로 영지 반경을 넓힙니다
#   /guild war <길드>       선전포고
#
# 영지 안에서는:
#   - 길드에 속하지 않은 사람은 블록을 부술 수 없습니다 (전쟁 중인 상대는 예외)
#   - 길드원은 이동속도 / 채굴속도 / 점프 버프를 받습니다
#   - 작물이 한 단계 더 자랍니다 (자연 성장 1회당 +bonus 단계)
#
# 금고와 투자의 관계가 이 시스템의 핵심입니다. 금고에 쌓아 둔 골드는 전쟁에서 지면
# 통째로 넘어가지만, 투자한 골드는 이미 땅이 되어 빼앗기지 않습니다. 쌓아 둘지
# 넓힐지가 길드의 선택이 됩니다.
guild:
  name-max-length: 16
  max-members: 20
  create-cost: 2000            # 창설에 드는 골드. 0 이면 무료
  invite-timeout-seconds: 60
  # 공동 보관함 크기(줄). 6 = 큰 상자 한 개와 같은 54칸. 1~6 만 가능합니다.
  # 줄이면 넘치는 칸의 물건은 길드장 우편함으로 갑니다.
  vault-rows: 6
  vault-title: "&8%guild% 보관함"
  chat-prefix: "&2[%guild%] "   # %guild% 는 길드 이름으로 바뀝니다

  claim:
    # 영지는 길드당 한 곳입니다. 전쟁이 "상대 깃발을 부수면 승리"인데 깃발이
    # 여러 개면 무엇을 부숴야 이기는지가 정해지지 않기 때문입니다.
    radius: 32                 # 깃발에서 이만큼(정사각형)이 기본 영지. 높이는 무제한
    max-radius: 96             # 투자로 넓힐 수 있는 한계
    # 이만큼의 골드를 투자할 때마다 반경이 1블록 늘어납니다. 0 이면 확장을 끕니다.
    # 기본값 기준 32 -> 96 까지 넓히는 데 32,000 골드가 듭니다.
    invest-gold-per-block: 250
    # 다른 영지와 이만큼은 더 떨어져야 합니다(두 반경 합에 더해서).
    # 0 이면 경계가 딱 붙어, 블록 하나를 두고 다투게 됩니다.
    gap-between-claims: 16
    banner-cost: 3000          # 깃발 하나 값

    # "블록을 부술 수 없다"를 실제로 지키는 항목들.
    # block-place 를 끄면 외부인이 용암을 붓거나 TNT 를 놓을 수 있고,
    # explosions 를 끄면 크리퍼가 대신 부숴 줍니다.
    # 단, 교전 중인 길드의 영지는 폭발 보호가 풀립니다 - 어차피 상대 곡괭이에
    # 열려 있는 땅이라, TNT 를 공성 수단으로 쓸 수 있게 두는 편이 맞습니다.
    protect:
      block-place: true
      buckets: true
      explosions: true         # 폭발·불탐. 영지 밖 블록은 그대로 터집니다

    # 영지 안 길드원이 받는 버프. 숫자는 '레벨'이며 0 이면 끕니다.
    # 플레이어가 이미 더 센 효과를 갖고 있으면 덮어쓰지 않습니다.
    buffs:
      speed: 1
      haste: 1
      jump: 1

    # 자연 성장 1회마다 추가로 자랄 단계 수. 1 이면 수확까지 시간이 절반입니다.
    # 0 이면 성장 보너스를 끕니다.
    crop-growth-bonus-stages: 1

  # 길드 간 전쟁. 선포한 순간부터가 아니라 준비 시간이 지난 뒤부터 교전이며,
  # 그동안 양쪽 영지는 서로에게 열립니다. 상대 깃발을 먼저 부수는 쪽이 이기고
  # 진 길드 금고의 prize-percent 를 가져갑니다.
  #
  # 전쟁은 양방향입니다. 선포하면 우리 깃발도 같이 위험해지므로, "제일 약한
  # 길드에 선포하면 공짜"가 되지 않습니다.
  #
  # 전쟁 중에는 금고에서 골드를 뺄 수 없습니다(인출·투자 모두). 선포 시점의
  # 금고가 판돈이기 때문입니다 - 안 그러면 준비 시간에 비워 버리면 그만입니다.
  # 같은 이유로 자기 깃발을 부수는 것도, 길드를 해체하는 것도 항복 처리됩니다.
  war:
    declare-cost: 2500         # 선포하는 쪽 금고에서 나갑니다. 져도 돌려받지 않습니다
    # 선포 후 이만큼은 깃발을 건드릴 수 없습니다. 0 이면 즉시 교전.
    # 0 으로 두면 "선포"와 "승리"가 같은 행동이 되어, 상대가 접속해 있지 않은
    # 시간을 노리는 것이 최적 전략이 됩니다.
    preparation-minutes: 10
    duration-minutes: 60       # 이 안에 승부가 안 나면 무승부 (골드 이동 없음)
    cooldown-minutes: 1440     # 같은 상대에게 다시 선포하기까지
    prize-percent: 100         # 이긴 쪽이 가져가는 진 길드 금고의 비율

# /menu 로 여는 허브 화면. 여기서 스탯·직업·칭호·도감·업적·순위표·파티·경매장으로
# 갈 수 있습니다. settings.yml 에서 끈 기능은 회색 칸으로 남아 자리만 지킵니다.
menu:
  title: "&8RPG 메뉴"

# 경매장. 골드로 사고파는 곳이고, 골드가 서버 밖으로 빠져나가는 곳이기도 합니다.
#
#   시작가만 정하면 순수 입찰 경매, 즉시구매가까지 정하면 바로 살 수도 있습니다.
#   입찰하는 순간 골드를 실제로 걷어 가므로, 밀려난 사람은 그 자리에서 돌려받습니다.
#   낙찰·유찰·정산은 상대가 접속 중이 아니어도 우편함(mailbox.yml)에 보관됩니다.
#
# 수수료 두 가지가 골드를 회수하는 장치입니다. 등록 수수료는 올릴 때 받고 유찰돼도
# 돌려주지 않으므로(=빈 물건 도배 방지), 판매 수수료는 팔렸을 때 대금에서 뗍니다.
# 둘 다 0 으로 두면 골드가 서버에 계속 쌓이기만 합니다.
auction:
  title: "&8경매장"
  duration-minutes: 1440       # 한 물건이 걸려 있는 시간. 1440 = 24시간
  max-listings-per-player: 5   # 한 사람이 동시에 올릴 수 있는 개수
  min-price: 1
  max-price: 1000000
  listing-fee-percent: 5       # 등록 시 (시작가/즉시구매가 중 큰 쪽)의 %
  tax-percent: 5               # 팔렸을 때 낙찰가에서 떼는 %
  bid-increment-percent: 5     # 다음 입찰가 = 현재가 + 현재가의 이 %
  # 마감 직전에 입찰이 들어오면 종료를 이만큼 미룹니다. 0 이면 미루지 않습니다.
  # 0 으로 두면 "마지막 순간에 찔러 넣기"가 최선의 전략이 되어, 값이 아니라
  # 핑으로 이기는 경매가 됩니다.
  anti-snipe-seconds: 60
  announce-new-lots: true      # 새 물건이 올라오면 전체 공지

gui:
  title: "&8캐릭터 정보"
  # 27~54 사이 9의 배수. 벗어나면 자동으로 맞춰집니다.
  size: 27

