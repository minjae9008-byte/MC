# ==========================================================================
#  RPGCore - 세부 설정
# ==========================================================================
#  자주 바꾸는 값(최대 레벨, 경험치 곡선, 인챈트 한계, 기능 on/off)은
#  settings.yml 에, 직업 정의는 jobs.yml, 업적과 칭호는 achievements.yml,
#  수집 도감은 collection.yml 에 있습니다. 이 파일은 아이템 분류나
#  모루 조합법처럼 목록이 긴 설정을 담습니다.
#
#  아이템/블록 목록은 ID 와 태그를 섞어 쓸 수 있습니다:
#    minecraft:stone            낱개 ID
#    '#minecraft:planks'        바닐라 태그 (그 태그에 속한 전부)
#    '#myserver:custom'         서버에 깔린 다른 데이터팩의 태그
#  이 서버 버전에 없는 항목은 경고만 남기고 건너뜁니다.
#
#  지금 설정이 어떻게 읽혔는지는 /rpgcore check 로 확인하세요.
# ==========================================================================

# ==========================================================================
#  스탯
# ==========================================================================
#  스탯 하나가 여러 가지를 동시에 올립니다. 한 스탯이 숫자 하나만 움직이면
#  그건 선택이 아니라 그냥 숫자입니다 - "공격력 스탯"으로 읽히고 찍거나 안
#  찍거나로 끝납니다. 스탯마다 2~3가지를 주면 어떤 빌드든 포기하는 것이
#  실제로 생깁니다.
#
#    STR  공격력 · 소지무게 · 밀쳐내기
#    DEX  공격속도 · 채굴속도 · 휩쓸기 피해
#    VIT  최대체력 · 넉백 저항
#    AGI  이동속도 · 점프 · 낙하 안전거리
#    LUCK 행운(낚시 등) · 몬스터 처치 보상 2배 확률
#
#  소프트캡이 핵심입니다. 캡까지는 포인트당 100%, 그 뒤로는 일부만
#  적용됩니다. 이게 없으면 빌드의 질문이 "어느 스탯"이 아니라 "몇 점"만
#  남습니다 - 포인트마다 값어치가 같으니 제일 센 스탯에 전부 붓는 게 항상
#  정답이고, 모든 플레이어가 똑같아집니다.
#
#  기본값(캡 20 / 초과분 35%) 기준 레벨 50(54포인트):
#    한 스탯에 전부  -> 실효 31.9 (포인트 54개로 32개 값)
#    20/20/14 로 분산 -> 실효 20/20/14 = 54 전부 100%
#  그래서 두 번째 스탯을 찍는 쪽이 첫 스탯을 깊게 파는 것보다 항상 이득이고,
#  자연히 "주 특화 + 부 특화" 형태가 됩니다.
stats:
  soft-cap: 20                  # 여기까지는 포인트당 100%
  beyond-soft-cap-percent: 35   # 그 뒤로는 이만큼만. 0 이면 캡이 곧 상한
  # 0 으로 두면 곡선을 끄고 예전처럼 완전 선형이 됩니다.

  base-hp: 20           # 어트리뷰트 기준값. 20 = 바닐라 10칸
  # 레벨은 체력을 조금만 줍니다. 레벨당 2였을 때는 레벨 50에서 아무 것도
  # 안 찍고 120(60칸)이 되어 VIT 를 찍을 이유가 사라졌습니다.
  hp-per-level: 1
  hp-per-vit: 2
  attack-damage-per-str: 0.35   # 20포인트 = +7 (다이아검 7 -> 14)
  attack-knockback-per-str: 0.02
  attack-speed-per-dex: 0.06    # 20포인트 = 초당 타격 +30%
  mining-speed-per-dex: 0.008   # 합계 비율. 20포인트 = 채굴 +16%
  sweeping-damage-per-dex: 0.01
  knockback-resistance-per-vit: 0.008
  movement-speed-per-agi: 0.0012  # 20포인트 = +24%. 이동속도는 과하기 쉽습니다
  jump-strength-per-agi: 0.007    # 자바 전용: 베드락에는 점프 어트리뷰트가 없습니다
  safe-fall-blocks-per-agi: 0.15  # 20포인트 = 3블록 더 떨어져도 안 아픔
  luck-per-luck: 0.4

weight:
  base-capacity: 100
  capacity-per-str: 8
  # Weight is only recomputed for players whose inventory changed (events set
  # a dirty flag). These two just bound the worst case.
  scans-per-tick: 8
  safety-rescan-ticks: 200
  default-item-weight: 1
  # 아이템 설명(툴팁)에 붙는 무게 한 줄. %weight% 는 "1개당" 무게입니다.
  # 개수와 무관한 값이라야 같은 아이템끼리 계속 겹쳐지므로 총합은 넣지 않습니다.
  # 끄려면 settings.yml 의 features.item-weight-lore 를 false 로.
  lore-format: "&8무게 %weight%"
  # 아이템 1개당 무게이며 개수만큼 곱해집니다.
