# RPGCore configuration.
#
# The plugin owns all gameplay logic. The bundled datapack only supplies the
# item/block classification tags (#rpgcore:weight_*, #rpgcore:tree_log,
# #rpgcore:treefell_tool); when those tags are present they win, and the lists
# further down are the fallback for servers running without the datapack.

leveling:
  xp-base: 100          # XP needed for level 2
  xp-growth: 50         # extra XP needed per level after that
  starting-points: 5
  points-per-level: 1

stats:
  base-hp: 20           # attribute points; 20 = the vanilla 10 hearts
  hp-per-level: 2
  hp-per-vit: 1
  attack-damage-per-str: 0.5
  attack-speed-per-dex: 0.05
  movement-speed-per-agi: 0.002
  jump-strength-per-agi: 0.01   # Java only: Bedrock has no jump attribute
  luck-per-luck: 0.5

weight:
  base-capacity: 100
  capacity-per-str: 10
  # Weight is only recomputed for players whose inventory changed (events set
  # a dirty flag). These two just bound the worst case.
  scans-per-tick: 8
  safety-rescan-ticks: 200
  default-item-weight: 1
  # Weight per item, multiplied by stack size. Each tier prefers the matching
  # #rpgcore:weight_<tier> datapack tag; the items list is the fallback.
  tiers:
    light:
      weight: 1
      items: [minecraft:stick, minecraft:string, minecraft:feather, minecraft:paper, minecraft:redstone, minecraft:gunpowder, minecraft:arrow, minecraft:wheat, minecraft:leather]
    medium:
      weight: 3
      items: [minecraft:oak_planks, minecraft:oak_log, minecraft:iron_sword, minecraft:iron_axe, minecraft:bread, minecraft:bucket, minecraft:iron_ingot, minecraft:gold_ingot]
    heavy:
      weight: 8
      items: [minecraft:cobblestone, minecraft:stone, minecraft:deepslate, minecraft:obsidian, minecraft:iron_block, minecraft:raw_iron, minecraft:chest, minecraft:furnace, minecraft:anvil, minecraft:iron_chestplate, minecraft:diamond_chestplate]
    very_heavy:
      weight: 20
      items: [minecraft:netherite_ingot, minecraft:netherite_block, minecraft:beacon, minecraft:diamond_block, minecraft:emerald_block, minecraft:shulker_box, minecraft:enchanting_table]

tree-felling:
  enabled: true
  # Hard cap per tree, so a griefed "log wall" can never run away.
  max-blocks: 256
  # Blocks removed per tick; the rest is queued, so big trees never spike.
  blocks-per-tick: 12
  # Fire a BlockBreakEvent for every chained block so WorldGuard/GriefPrevention
  # and friends can veto it. Costs one event per block; leave on unless you
  # have no protection plugins.
  respect-protection-plugins: true
  damage-tool: true
  sneak-disables: true
  # Fallbacks used only when the datapack tags are absent.
  logs: ['#minecraft:logs']
  tools: ['#minecraft:axes']

# 내구도에 따른 성능 저하.
# 남은 내구도가 full-performance-above% 이상이면 페널티 없음, 그 아래부터
# 0%까지 minimum-performance%로 직선 감소합니다. 아이템 자체는 건드리지 않고
# 플레이어 어트리뷰트에 MULTIPLY_SCALAR_1 모디파이어로 적용합니다.
# (수리하면 그대로 성능이 돌아오므로, 아래 anvil 조합법의 repair-percent가
#  곧 성능 회복입니다.)
durability-scaling:
  enabled: true
  full-performance-above: 50
  minimum-performance: 50
  affects:
    attack-damage: true      # 주 손 아이템 기준
    armor: true              # 착용 중인 방어구의 평균 내구도 기준
    mining-speed: true       # block_break_speed (1.21.2+, 없으면 자동 무시)

# 모루 커스텀 조합법. 왼쪽 칸=강화할 장비, 오른쪽 칸=재료.
# target 은 아이템 ID 또는 태그(#minecraft:..., #rpgcore:...) 목록입니다.
# 조합법이 일치하지 않는 조합은 전부 바닐라 모루 동작 그대로입니다.
# 주의: 재료를 그 장비의 바닐라 수리 재료(예: 다이아 갑옷 + 다이아)로 두면
# 바닐라 수리를 덮어쓰게 되므로 겹치지 않는 재료를 쓰세요.
anvil:
  enabled: true
  recipes:
    sharpen:
      name: "&b연마 (날카로움)"
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:flint
      ingredient-amount: 4
      level-cost: 5
      enchantments:
        sharpness: 1
    smite:
      name: "&b성수 (강타)"
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:bone_block
      ingredient-amount: 2
      level-cost: 5
      enchantments:
        smite: 1
    bane:
      name: "&b해충 퇴치 (벌레 죽이기)"
      target: ['#minecraft:enchantable/sharp_weapon']
      ingredient: minecraft:fermented_spider_eye
      ingredient-amount: 2
      level-cost: 5
      enchantments:
        bane_of_arthropods: 1
    efficiency:
      name: "&b연마석 (효율)"
      target: ['#minecraft:enchantable/mining']
      ingredient: minecraft:amethyst_shard
      ingredient-amount: 4
      level-cost: 5
      enchantments:
        efficiency: 1
    protection:
      name: "&b보호 각인 (보호)"
      target: ['#minecraft:enchantable/armor']
      ingredient: minecraft:echo_shard
      ingredient-amount: 1
      level-cost: 6
      enchantments:
        protection: 1
    reinforce:
      name: "&b강화 (내구성)"
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:obsidian
      ingredient-amount: 4
      level-cost: 8
      enchantments:
        unbreaking: 1
    repair-kit:
      name: "&a수리 키트"
      target: ['#minecraft:enchantable/durability']
      ingredient: minecraft:copper_ingot
      ingredient-amount: 2
      level-cost: 2
      repair-percent: 25

hud:
  enabled: true
  # Action-bar text persists ~3s, so once a second is smooth and cheap.
  interval-ticks: 20

xp-sources:
  per-mob-kill: 10
  per-tree-log: 1

proximity-chat:
  enabled: true
  range: 24
  # %player% and %message% are replaced; '&' colour codes are supported.
  format: "&7[근접] &f%player%&7: &f%message%"
  # true  = players outside the range do not receive the message at all
  #         (real proximity chat).
  # false = everyone still receives it; only the [근접] formatting is applied.
  hide-out-of-range: true

voicechat:
  # Real voice audio comes from the Simple Voice Chat plugin (Java clients
  # only). Set its own voice_chat_distance to match proximity-chat.range.
  sync-range-with-proximity-chat: true

gui:
  title: "&8캐릭터 정보"
  size: 27

bedrock:
  # With Geyser + Floodgate installed, show Bedrock players a native Bedrock
  # form for /stats instead of the chest GUI. Falls back to the chest GUI
  # automatically if Floodgate is missing or its API doesn't match.
  use-native-forms: true
