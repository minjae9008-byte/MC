name: RPGCorePlugin
version: '2.0.0'
main: com.rpgcore.plugin.RpgCorePlugin
api-version: '26.2'
author: RPGCore
description: >
  RPG stats, encumbrance, gear wear, chain tree-felling, custom anvil
  upgrades and proximity chat. Everything is server-side, so Java and
  Bedrock (Geyser) players get identical behaviour. No dependencies.

commands:
  stats:
    description: Open your RPGCore stats menu.
    aliases: [rpg, rpgstats]
  rpgcore:
    description: RPGCore admin commands (reload, recipes, givexp, reset).
    permission: rpgcore.admin
    usage: /rpgcore reload | recipes | givexp <player> <amount> | reset <player>
    default: op

permissions:
  rpgcore.admin:
    description: Manage RPGCore.
    default: op
