name: RPGCorePlugin
version: '1.0.0'
main: com.rpgcore.plugin.RpgCorePlugin
api-version: '1.21'
author: RPGCore
description: >
  Companion plugin for the RPGCore datapack. Adds a real chest-GUI stats
  menu, server-side proximity text chat, and an optional Simple Voice Chat
  integration. The datapack remains the source of truth for all stats -
  this plugin only reads/writes the same scoreboard objectives.
# All three are optional. floodgate/Geyser-Spigot are listed so we load after
# them and can detect Bedrock players; voicechat enables the (optional) real
# proximity voice integration.
softdepend: [voicechat, floodgate, Geyser-Spigot]

commands:
  stats:
    description: Open your RPGCore stats menu.
    aliases: [rpg, rpgstats]
  rpgcorereload:
    description: Reload the RPGCore plugin config.
    permission: rpgcore.admin
    default: op

permissions:
  rpgcore.admin:
    description: Manage RPGCore plugin settings.
    default: op
