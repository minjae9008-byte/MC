name: RPGCorePlugin
version: '2.0.0'
main: com.rpgcore.plugin.RpgCorePlugin
api-version: '26.2'
author: RPGCore
description: >
  RPG stats, jobs, leaderboards, persistent parties, player trading,
  encumbrance, gear wear, chain tree-felling, custom anvil upgrades and
  proximity chat. Everything is server-side, so Java and Bedrock (Geyser)
  players get identical behaviour. No dependencies.

commands:
  stats:
    description: Open your RPGCore stats menu.
    aliases: [rpg, rpgstats]
  job:
    description: Pick or view your job (class).
    aliases: [class, jobs]
  leaderboard:
    description: Show the RPGCore rankings.
    aliases: [top, lb, ranking]
  party:
    description: Create and manage a party.
    aliases: [pt]
  p:
    description: Send a message to your party.
    aliases: [pchat, partychat]
  trade:
    description: Trade items with another player.
    aliases: [거래, tr]
  rpgcore:
    description: RPGCore admin commands (reload, recipes, givexp, reset).
    permission: rpgcore.admin
    usage: /rpgcore reload | recipes | givexp <player> <amount> | reset <player>
    default: op

permissions:
  rpgcore.admin:
    description: Manage RPGCore.
    default: op
