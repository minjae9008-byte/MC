name: RPGCorePlugin
version: '2.9.0'
main: com.rpgcore.plugin.RpgCorePlugin
api-version: '26.2'
author: RPGCore
description: >
  RPG stats, jobs, leaderboards, persistent parties, player trading,
  achievements and titles, a collection log, wagered 1v1 duels, a gold auction
  house, a supply-and-demand market, a bank with deposits, term savings and
  credit-scored loans, a central bank that sets the rate from measured
  inflation, companies that run factories and issue shares, blueprints that
  build themselves at market prices, encumbrance,
  gear wear, chain tree-felling, custom anvil upgrades and proximity chat.
  One /menu screen reaches all of it.
  Everything is server-side, so Java and Bedrock (Geyser) players get
  identical behaviour. No dependencies.

commands:
  menu:
    description: Open the RPGCore hub - every other screen from one place.
    aliases: [rpgmenu, 메뉴]
  auction:
    description: Browse, sell on, and collect from the auction house.
    aliases: [ah, 경매, 경매장]
  market:
    description: Buy and sell at the market, where prices move with supply.
    aliases: [shop, 시장, 상점]
  bank:
    description: Deposits, term savings, loans and your credit grade.
    aliases: [은행]
  economy:
    description: The economic dashboard - prices, rates, money and output.
    aliases: [eco, 경제, 지표]
  company:
    description: Found and run a company - factories, staff, shares and takeovers.
    aliases: [corp, 기업, 회사]
  stocks:
    description: Invest in listed companies and collect dividends.
    aliases: [stock, 주식, 거래소]
  blueprint:
    description: Capture a region, pay market price, and have it built for you.
    aliases: [bp, 청사진, 설계]
  stats:
    description: Open your RPGCore stats menu.
    aliases: [rpg, rpgstats]
  job:
    description: Pick or view your job (class).
    aliases: [class, jobs]
  leaderboard:
    description: Show the RPGCore rankings.
    aliases: [top, lb, ranking]
  party:
    description: Create and manage a party.
    aliases: [pt]
  p:
    description: Send a message to your party.
    aliases: [pchat, partychat]
  trade:
    description: Trade items with another player.
    aliases: [거래, tr]
  titles:
    description: Pick the title shown next to your name.
    aliases: [칭호]
  achievements:
    description: Show your achievement progress.
    aliases: [ach, 업적]
  collection:
    description: Open the collection log.
    aliases: [dex, 도감]
  duel:
    description: Challenge another player to a wagered 1v1.
    aliases: [대결]
  gold:
    description: Show a gold balance.
    aliases: [money, 골드]
  pay:
    description: Send gold to another player.
    aliases: [송금]
  rpgcore:
    description: RPGCore admin commands (reload, check, recipes, givexp, givegold, reset).
    permission: rpgcore.admin
    usage: /rpgcore reload | check | recipes | givexp <player> <amount> | givegold <player> <amount> | reset <player>
    default: op

permissions:
  rpgcore.admin:
    description: Manage RPGCore.
    default: op
