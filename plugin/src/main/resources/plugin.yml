name: RPGCorePlugin
version: '2.0.0'
main: com.rpgcore.plugin.RpgCorePlugin
api-version: '26.2'
author: RPGCore
description: >
  RPG stats, encumbrance and chain tree-felling for Paper, plus proximity
  chat and a cross-play stats UI. All gameplay logic runs here; the bundled
  datapack is only a tag-based data layer with no per-tick work.
# All three are optional. floodgate/Geyser-Spigot are listed so we load after
# them and can detect Bedrock players; voicechat enables the (optional) real
# proximity voice integration.
softdepend: [voicechat, floodgate, Geyser-Spigot]

commands:
  stats:
    description: Open your RPGCore stats menu.
    aliases: [rpg, rpgstats]
  rpgcore:
    description: RPGCore admin commands (reload, recipes, givexp, reset).
    permission: rpgcore.admin
    usage: /rpgcore reload | recipes | givexp <player> <amount> | reset <player>
    default: op

permissions:
  rpgcore.admin:
    description: Manage RPGCore.
    default: op
