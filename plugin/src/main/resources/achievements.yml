# ==========================================================================
#  RPGCore - 업적과 칭호
# ==========================================================================
#  목표를 달성하면 골드/경험치 보상과 칭호를 줍니다.
#  칭호는 /titles 에서 골라 이름 옆에 붙일 수 있습니다.
#
#  업적 하나는 이렇게 씁니다:
#
#    내-업적-id:                # 아무 키나 가능. 칭호 id 로도 쓰입니다.
#      display: "&e사냥꾼"       # 달성했을 때 보여줄 이름
#      description: "설명 한 줄"  # /achievements 목록과 안내에 표시
#      icon: minecraft:iron_sword # /titles 메뉴 아이콘
#      type: mob-kills           # 아래 '측정 기준' 중 하나
#      goal: 100                 # 이 값에 닿으면 달성
#      first-only: false         # true 면 서버에서 딱 한 명만 가져갑니다
#      title: "&e[사냥꾼]"        # 주는 칭호. 비우면 보상만 주고 칭호는 없음
#      reward-gold: 100
#      reward-xp: 50
#
#  측정 기준(type):
#    mob-kills      몬스터 처치 수
#    blocks-mined   부순 블록 수
#    ores-mined     캔 광석 수
#    logs-chopped   벤 원목 수 (연쇄 벌목 포함)
#    fish-caught    낚은 물고기 수
#    duels-won      대결 승리 수
#    gold-earned    누적으로 번 골드 (대결로 딴 골드는 제외)
#    collected      도감에 등록한 종류 수
#    level          RPG 레벨
#
#  first-only 는 '서버 최초' 기록입니다. 먼저 달성한 사람이 가져가면
#  plugins/RPGCorePlugin/records.yml 에 이름이 남고 다시는 열리지 않습니다.
#  (누가 가져갔는지는 /achievements 에서 볼 수 있습니다.)
#
#  창작 모드로 부순 블록과 낚은 물고기는 세지 않습니다.
# ==========================================================================

# 칭호가 걸린 업적과 '서버 최초' 업적은 서버 전체에 알립니다.
announce-to-server: true

