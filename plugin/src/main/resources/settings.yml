# ==========================================================================
#  RPGCore - 간단 설정
# ==========================================================================
#  자주 바꾸는 값만 모아둔 파일입니다. 고친 뒤 /rpgcore reload 하면 바로 반영됩니다.
#
#   - 직업을 만들거나 고치려면      -> jobs.yml
#   - 업적과 칭호를 만들려면        -> achievements.yml
#   - 도감에 수집 분류를 넣으려면    -> collection.yml
#   - 아이템 무게, 모루 조합법 등    -> config.yml
#   - 지금 설정이 어떻게 읽혔는지     -> /rpgcore check
# ==========================================================================

level:
  # 최대 레벨. 0 이면 제한 없음.
  # 최대 레벨에 닿으면 더 이상 XP 가 쌓이지 않고 안내 메시지가 한 번 나갑니다.
  max: 0

  # 레벨 곡선. 다음 레벨까지 필요한 XP 는 이렇게 계산됩니다.
  #   (xp-base + (현재레벨-1) x xp-growth) x (xp-multiplier ^ (현재레벨-1))
  #
  # 기본값(80 / 30 / 1.022)은 이렇게 됩니다:
  #   Lv2:80  Lv10:380  Lv20:917  Lv30:1,692  Lv50:4,320
  #   레벨 50까지 누적 약 80,000 XP (몹만 잡는다면 5,400마리)
  #
  # 곡선을 넣은 이유: 배수 1.0 이면 50레벨이 10레벨과 똑같은 무게로 느껴집니다.
  # 1.022 에서는 마지막 레벨이 10레벨의 10배가 들어서, 초반은 빠르게 흐르고
  # 후반 레벨 하나하나가 실제로 사건이 됩니다.
  #
  #   xp-multiplier 1.0   = 직선 (후반이 밋밋함)
  #   xp-multiplier 1.022 = 기본. 레벨 50까지 대략 35시간
  #   xp-multiplier 1.05  = 가파름. 후반이 아주 길어집니다
  xp-base: 80
  xp-growth: 30
  xp-multiplier: 1.022

  # 레벨업 때 주는 스탯 포인트와, 처음 시작할 때 주는 포인트.
  points-per-level: 1
  starting-points: 5

# 경험치를 어디서 얼마나 받는지.
# 파티로 나눠 받을 때는 인원 보너스가 따로 붙습니다(config.yml 의 party.xp).
xp-sources:
  per-mob-kill: 15
  per-tree-log: 2

# 모루 강화(config.yml 의 anvil.recipes)로 올릴 수 있는 인챈트 한계.
enchant:
  # true  = 바닐라 최대 레벨까지만 (날카로움 5, 보호 4 ...)
  # false = 아래 max-level 까지 계속 올릴 수 있음
  respect-vanilla-limits: false
  # respect-vanilla-limits 가 false 일 때의 상한. 1 ~ 255.
  # 조합법마다 max-level 을 따로 적으면 그쪽이 우선입니다.
  max-level: 255

# 기능을 통째로 켜고 끕니다. 끄면 관련 명령어도 막힙니다.
features:
  jobs: true                # 직업 (/job)
  parties: true             # 파티 (/party, /p)
  trading: true             # 거래 (/trade)
  leaderboard: true         # 순위표 (/leaderboard)
  tree-felling: true        # 연쇄 벌목
  durability-scaling: true  # 내구도에 따른 성능 저하
  anvil-recipes: true       # 모루 커스텀 강화
  proximity-chat: true      # 근접 채팅
  hud: true                 # 액션바 HUD
  nameplate: true           # 머리 위 이름표에 파티/레벨/직업 표시
  tablist: true             # 플레이어 목록(Tab)에 파티/레벨 표시
  item-weight-lore: true    # 아이템 설명에 무게 한 줄 표시
  achievements: true        # 업적과 칭호 (/achievements, /titles)
  collection: true          # 수집 도감 (/collection)
  duels: true               # 1:1 대결 (/duel)
  auction: true             # 경매장 (/auction) - 골드로 사고팔기
  companies: true           # 기업 (/company, /stocks) - 공장·생산·주식·인수
  blueprints: true          # 청사진 (/blueprint) - 구역을 떠서 자동 건설
  market: true              # 시장 (/market) - 수요·공급으로 값이 움직이는 상점
  bank: true                # 은행 (/bank) - 예금·정기예금·대출·신용등급
# 시장과 은행의 세부 설정(임금, 초기 공급, 금리, 지급준비율, 물가목표 등)은
# economy.yml 에 있습니다. 지표는 /economy 로 봅니다.
