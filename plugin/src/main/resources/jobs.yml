        entity_interaction_range: 1.0
        safe_fall_distance: 3
      multiply:
        movement_speed: 0.06

  smith:
    name: "&7대장장이"
    icon: minecraft:anvil
    description:
      - "&7무겁게 들고 다니며 장비를 고칩니다."
