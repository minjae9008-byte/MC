# ==========================================================================
#  RPGCore - 직업(클래스) 정의
#  직업은 3단계로 나뉩니다.
#    1단계 (레벨 1)   - 바로 고를 수 있는 기본 직업. 방향만 정해 줍니다.
#    2단계 (레벨 12)  - 한 가지를 확실히 잘하는 대신 다른 하나를 포기합니다.
#    3단계 (레벨 30)  - 극단적인 특화. 약점이 분명한 대신 강점이 큽니다.
#
#  stat-bonus 는 소프트캡(settings.yml 의 stats.soft-cap)에 함께 들어갑니다.
#  즉 자기 특화와 같은 스탯을 주는 직업을 고르면 캡에 더 빨리 닿습니다 -
#  그게 직업을 고르는 이유입니다.
#
#  attributes.multiply 는 합계에 대한 비율이라 강력합니다. 0.25 = +25%.
# ==========================================================================

list:

  # --- 1단계: 레벨 1부터 ----------------------------------------------------

  warrior:
    name: "&c전사"
    icon: minecraft:iron_sword
    description:
      - "&7앞에 서서 버티는 기본형."
      - "&8공격과 체력을 고루 받습니다."
    stat-bonus:
      str: 3
      vit: 2
    weight-bonus: 30
    attributes:
      add:
        max_health: 4
      multiply:
        knockback_resistance: 0.15

  archer:
    name: "&a궁수"
    icon: minecraft:bow
    description:
      - "&7거리를 두고 싸웁니다."
      - "&8활 피해는 무기 상태를 그대로 따라갑니다."
    stat-bonus:
      dex: 3
      agi: 2
    attributes:
      multiply:
        movement_speed: 0.08
      add:
        entity_interaction_range: 0.5

  miner:
    name: "&e광부"
    icon: minecraft:iron_pickaxe
    description:
      - "&7캐고 나르는 데 특화."
      - "&8물속에서도 채굴 속도가 유지됩니다."
    stat-bonus:
      str: 2
      vit: 1
    weight-bonus: 70
    xp-multiplier: 1.1
    attributes:
      multiply:
        block_break_speed: 0.25
        submerged_mining_speed: 1.0
      add:
        oxygen_bonus: 2

  lumberjack:
    name: "&6나무꾼"
    icon: minecraft:iron_axe
    description:
      - "&7연쇄 벌목으로 먹고삽니다."
      - "&8나무를 벨 때 받는 경험치가 늘어납니다."
    stat-bonus:
      str: 2
      dex: 2
    weight-bonus: 50
    xp-multiplier: 1.15
    attributes:
      multiply:
        block_break_speed: 0.15

  fisher:
    name: "&b어부"
    icon: minecraft:fishing_rod
    description:
      - "&7물에서 강하고 운이 좋습니다."
      - "&8숨을 오래 참고 물속에서 빠릅니다."
    stat-bonus:
      luck: 4
      vit: 1
    attributes:
      add:
        oxygen_bonus: 4
      multiply:
        water_movement_efficiency: 0.6

  # --- 2단계: 레벨 12부터 ---------------------------------------------------

  knight:
    name: "&9기사"
    icon: minecraft:shield
